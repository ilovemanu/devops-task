apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloapp
  labels:
    app.kubernetes.io/name: helloapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helloapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloapp
    spec:
      containers:
        - name: helloapp
          image: helloapp
          ports:
            - name: http
              containerPort: 8080
          # Probes hit "/" so the app needs no changes; a dedicated /healthz
          # endpoint would be better once the app grows.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
